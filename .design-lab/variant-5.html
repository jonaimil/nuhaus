<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variant 5: Idle Drift + Snap</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; overflow: hidden; font-family: system-ui, sans-serif; }
        canvas { display: block; }
        .label {
            position: fixed;
            top: 24px;
            left: 24px;
            color: white;
            z-index: 100;
        }
        .label h1 { font-size: 14px; font-weight: 500; opacity: 0.9; margin-bottom: 4px; }
        .label p { font-size: 12px; opacity: 0.5; max-width: 300px; line-height: 1.5; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="label">
        <h1>Variant 5: Idle Drift + Snap</h1>
        <p>Blocks slowly drift out of position, then snap back. Visible lazy corrections with noticeable movement range.</p>
    </div>
    <canvas id="gl"></canvas>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const canvas = document.getElementById('gl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 15, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(14, 10, 14);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x111111, 0.5));
        const mainLight = new THREE.DirectionalLight(0xffffff, 4);
        mainLight.position.set(10, 20, 10);
        scene.add(mainLight);

        // Config matching original
        const FLOORS = 6;
        const BLOCK_GAP = 0.3;
        const LAYER_GAP = 1.0;
        const BLOCK_HEIGHT = 0.3;
        const SPREAD = 1.0 + (BLOCK_GAP * 0.2);

        const geometry = new THREE.BoxGeometry(2, BLOCK_HEIGHT, 1);
        const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffffff,
            emissiveIntensity: 0.1,
            roughness: 0.2,
            metalness: 0.1
        });

        function generateLayout() {
            const blocks = [];
            blocks.push({ x: 0, z: -0.5, rot: 0 });
            blocks.push({ x: 0, z: 0.5, rot: 0 });
            for (let ring = 0; ring <= 2; ring++) {
                const edgePos = 1.5 + ring;
                const numH = ring + 2;
                const numV = ring + 1;
                for (let i = 0; i < numH; i++) {
                    blocks.push({ x: -(ring + 1) + i * 2, z: -edgePos, rot: 0 });
                    blocks.push({ x: -(ring + 1) + i * 2, z: edgePos, rot: 0 });
                }
                for (let i = 0; i < numV; i++) {
                    blocks.push({ x: -edgePos, z: -ring + i * 2, rot: Math.PI / 2 });
                    blocks.push({ x: edgePos, z: -ring + i * 2, rot: Math.PI / 2 });
                }
            }
            return blocks;
        }

        const layout = generateLayout();
        const meshes = [];
        const blockStates = [];

        for (let f = 0; f < FLOORS; f++) {
            const floorHeight = BLOCK_HEIGHT + LAYER_GAP;
            const stackHeight = FLOORS * floorHeight;
            const baseY = (f * floorHeight) - (stackHeight / 2);

            layout.forEach(block => {
                const mesh = new THREE.Mesh(geometry, material);
                const posX = block.x * SPREAD;
                const posZ = block.z * SPREAD;
                mesh.position.set(posX, baseY, posZ);
                mesh.rotation.y = block.rot;
                mesh.userData = {
                    baseX: posX,
                    baseY,
                    baseZ: posZ,
                    stateIdx: meshes.length
                };
                scene.add(mesh);
                meshes.push(mesh);

                // State for drift animation - more pronounced
                blockStates.push({
                    offsetX: 0, offsetY: 0, offsetZ: 0,
                    driftX: (Math.random() - 0.5) * 0.004,
                    driftY: (Math.random() - 0.5) * 0.003,
                    driftZ: (Math.random() - 0.5) * 0.004,
                    snapPhase: Math.random() * Math.PI * 2
                });
            });
        }

        let lastSnapTime = 0;
        const snapInterval = 3.5; // Slightly faster snaps

        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001;

            const shouldSnap = Math.floor(t / snapInterval) > Math.floor(lastSnapTime / snapInterval);
            lastSnapTime = t;

            meshes.forEach(mesh => {
                const { baseX, baseY, baseZ, stateIdx } = mesh.userData;
                const state = blockStates[stateIdx];

                if (shouldSnap) {
                    const snapDelay = Math.sin(state.snapPhase) * 0.5 + 0.5;
                    setTimeout(() => {
                        state.offsetX *= 0.15;
                        state.offsetY *= 0.15;
                        state.offsetZ *= 0.15;
                        state.driftX = (Math.random() - 0.5) * 0.004;
                        state.driftY = (Math.random() - 0.5) * 0.003;
                        state.driftZ = (Math.random() - 0.5) * 0.004;
                    }, snapDelay * 150);
                }

                // Apply drift
                state.offsetX += state.driftX;
                state.offsetY += state.driftY;
                state.offsetZ += state.driftZ;

                // Larger max drift range
                const maxDriftXZ = 0.18;
                const maxDriftY = 0.22;
                state.offsetX = Math.max(-maxDriftXZ, Math.min(maxDriftXZ, state.offsetX));
                state.offsetY = Math.max(-maxDriftY, Math.min(maxDriftY, state.offsetY));
                state.offsetZ = Math.max(-maxDriftXZ, Math.min(maxDriftXZ, state.offsetZ));

                const currentX = mesh.position.x;
                const currentY = mesh.position.y;
                const currentZ = mesh.position.z;
                const targetX = baseX + state.offsetX;
                const targetY = baseY + state.offsetY;
                const targetZ = baseZ + state.offsetZ;

                mesh.position.x += (targetX - currentX) * 0.08;
                mesh.position.y += (targetY - currentY) * 0.08;
                mesh.position.z += (targetZ - currentZ) * 0.08;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
